services:
  backend:
    build: ./backend
    container_name: coolhead-backend
    env_file: .env
    environment:
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/store/products"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_PAYPAL_CLIENT_ID: ${VITE_PAYPAL_CLIENT_ID:-}
        VITE_API_BASE: ""
    container_name: coolhead-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
